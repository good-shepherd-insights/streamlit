# key=value conf file fixture (Backend B style, /etc/streamctl/streamctl.conf)
# lines starting with # and blank lines are ignored
CF_API_BASE = https://api.cloudflare.test/client/v4

CF_ZONE_ID = zone_test_123
CF_ACCOUNT_ID = acct_test_456
CF_TUNNEL_ID = tun_test_789

PUBLIC_DOMAIN = apps.example.test
API_HOSTNAME = router.example.test

HMAC_SECRET = file-hmac-secret
REPLAY_WINDOW_SEC = 300
ROUTE_WAIT_SEC = 30
APPLY_MAX_RETRIES = 3
RECONCILE_INTERVAL_SEC = 3600

# Backend B only: self-hosted FastAPI adapter wiring
INTENTS_PATH = /v1/intents
STREAMCTL_ROUTER_BIND = 127.0.0.1
STREAMCTL_ROUTER_PORT = 8515
STREAMCTL_ROUTER_DB = /var/lib/streamctl/router-intents.sqlite3
CF_API_KEY_FILE = cf-router/test/fixtures/cf_api_key

# streamctl/cf_router_local.py: targets the router may accept (comma-separated)
TARGETS = home,container

# streamctl/container_executor.py: container app pipeline (all from conf, no literals)
WORK_ROOT = cf-router/test/fixtures/workroot
IMAGE_PREFIX = registry.test/apps/
IMAGE_TAG_SUFFIX = latest
CF_REGISTRY_HOST = registry.cloudflare.test
CF_REGISTRY_USER = oauth2accesstoken
CONTAINER_PORT = 8501
CONTAINER_MAX_INSTANCES = 2
ROUTER_DUMMY_IP = 192.0.2.1
HEALTH_POLL_SEC = 0
HEALTH_TIMEOUT_SEC = 2
KEEP_WORKDIR = true
WRANGLER_BIN = wrangler-fake
CONTAINER_WRANGLER_TEMPLATE = templates/wrangler-container.toml.tmpl
CONTAINER_INDEX_TEMPLATE = templates/container-index.ts.tmpl
NPM_BIN = npm-fake
CF_CONTAINERS_PKG = ^0.3.7
HEALTH_RESOLVER = https://cloudflare-dns.com/dns-query
